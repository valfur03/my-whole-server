name: observability
include:
  - ../common/networks.yaml
services:
  prometheus:
    build: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-remote-write-receiver
    volumes:
      - prometheus-data:/prometheus
    networks:
      - metrics
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.4.12@sha256:83be3e511ede559bee80e2215bb1987cb1246075461cb961beb515b0341e7aea
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - metrics
      - proxy
    restart: unless-stopped
    labels:
      traefik.http.routers.grafana.rule: Host(`metrics.${BASE_DOMAIN}`)
      traefik.http.routers.grafana.tls: true
      traefik.http.services.grafana.loadbalancer.server.port: 3000
      traefik.enable: true
  node-exporter:
    image: prom/node-exporter:v1.11.1@sha256:e9cff4fc67b1818f8c97adb115b9f12c9a54b533de86765d4a0effc01b357205
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run|tmp)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - metrics
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.5@sha256:ee21727732c7a7199cb71c3eee9153bbf23f9b0b87619f0555a0cf21a67f1a33
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./otel/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - metrics
    restart: unless-stopped

  otel-collector:
    image: grafana/alloy:v1.16.1@sha256:51aeb9d829239345070619dad3edd6873186f913c84f45b365b74574fcb38ec0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - tempo
    volumes:
      - ./otel/collector/config.alloy:/etc/alloy/config.alloy:ro
      - otel-collector-data:/var/lib/alloy/data
    networks:
      - proxy
      - metrics
    labels:
      traefik.http.routers.otel-http-collector.rule: Host(`http.collector.traces.${BASE_DOMAIN}`)
      traefik.http.routers.otel-http-collector.tls: true
      traefik.http.routers.otel-http-collector.middlewares: authelia@docker
      traefik.http.services.otel-http-collector.loadbalancer.server.port: 4318
      traefik.enable: true
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
  otel-collector-data:
