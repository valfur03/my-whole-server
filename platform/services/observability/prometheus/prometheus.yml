global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
- job_name: "node"
  static_configs:
    - targets: ["node-exporter:9100"]
- job_name: "qbittorrent"
  static_configs:
    - targets: ["qbittorrent-exporter:17871"]
- job_name: "traefik"
  static_configs:
    - targets: ["traefik:8080"]
