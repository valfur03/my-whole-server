name: wireguard
include:
  - ../common/networks.yaml
services:
  adguard:
    image: adguard/adguardhome:v0.107.76@sha256:7157eb1dc3b26c7af1d6898759a7b3f7d0fa09891fbd2d3caa6abc1057a9179b
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    networks:
      proxy:
      AAA-vpn:
        ipv4_address: "10.8.1.3"
    labels:
      traefik.http.routers.adguard.rule: Host(`adguard.${BASE_DOMAIN}`)
      traefik.http.routers.adguard.tls: true
      traefik.http.services.adguard.loadbalancer.server.port: 80
      traefik.enable: true
    restart: unless-stopped
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:14@sha256:5f26407fd2ede54df76d63304ef184576a6c1bb73f934a58a11abdd852fab549
    ports:
      - 51820:51820/udp
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv4.ip_forward: 1
    environment:
      WG_HOST: "${HOST_IP}"
      WG_DEFAULT_DNS: "10.8.1.3"
      WG_POST_UP: >-
        iptables -t nat -A POSTROUTING -s 10.8.0.0/24 ! -o wg0 -j MASQUERADE;
        iptables -A INPUT -p udp -m udp --dport 51820 -j ACCEPT;
        iptables -A FORWARD -i wg0 -j ACCEPT;
        iptables -A FORWARD -o wg0 -j ACCEPT;
      WG_POST_DOWN: >-
        iptables -t nat -D POSTROUTING -s 10.8.0.0/24 ! -o wg0 -j MASQUERADE;
        iptables -D INPUT -p udp -m udp --dport 51820 -j ACCEPT;
        iptables -D FORWARD -i wg0 -j ACCEPT;
        iptables -D FORWARD -o wg0 -j ACCEPT;
    volumes:
      - wireguard:/etc/wireguard
    networks:
      AAA-vpn:
        ipv4_address: "10.8.1.2"
      proxy:
    labels:
      traefik.http.routers.wireguard.rule: Host(`wireguard.${BASE_DOMAIN}`)
      traefik.http.routers.wireguard.tls: true
      traefik.http.routers.wireguard.middlewares: authelia@docker
      traefik.http.services.wireguard.loadbalancer.server.port: 51821
      traefik.enable: true
    restart: unless-stopped

volumes:
  adguard-conf:
  adguard-work:
  wireguard:

networks:
  AAA-vpn:
    ipam:
      driver: default
      config:
        - subnet: 10.8.1.0/24
